<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Sistem Informasi Akademik</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0}.akun{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .ringkasan{background:#eaf1ff;padding:18px;border-radius:10px;margin:22px 0;font-size:17px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0;gap:10px;flex-wrap:wrap}
    .table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #cbd5e1;padding:10px;text-align:left}th{background:#eaf0f8}td .btn,td button{margin:3px}
    .tanpa-foto{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:8px;background:#e2e8f0;color:#64748b;font-size:11px}
  </style>
  <script>if (!localStorage.getItem('token')) window.location.replace('login.html');</script>
</head>
<body>
  <header>
    <h1>Dashboard Admin</h1>
    <div class="akun">Login sebagai: <strong id="info-user"></strong> (<span id="info-role"></span>)
      <button class="keluar" id="btn-logout" type="button">Logout</button>
    </div>
  </header>
  <section class="ringkasan">Total Mahasiswa: <strong id="total-mahasiswa">...</strong></section>
  <div class="toolbar"><h2>Data Mahasiswa</h2><a id="btn-tambah" class="btn aksi-admin" href="form_tambah.html">+ Tambah Mahasiswa</a></div>
  <div class="table-wrap"><table id="tabel-mahasiswa">
    <thead><tr><th>Foto</th><th>NIM</th><th>Nama</th><th>Program Studi</th><th class="aksi-admin">Aksi</th></tr></thead>
    <tbody><tr><td colspan="5">Memuat data...</td></tr></tbody>
  </table></div>
  <p class="catatan">Foto harus berupa JPG/PNG dengan ukuran maksimal 2MB. Pengelolaan data hanya tersedia untuk akun dengan role admin.</p>
  <script src="ui.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
